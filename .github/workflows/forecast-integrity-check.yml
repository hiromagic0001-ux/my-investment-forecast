name: Forecast integrity syntax check
on:
  pull_request:
    paths:
      - "scripts/daily-forecast.mjs"
      - "scripts/forecast-integrity.mjs"
      - ".github/workflows/forecast-integrity-check.yml"
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check forecast engine syntax
        run: node --check scripts/daily-forecast.mjs
