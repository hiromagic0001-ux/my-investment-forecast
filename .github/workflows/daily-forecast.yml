name: Daily investment forecast
on:
  push:
    branches: [main]
    paths-ignore:
      - forecast-history.json
      - market-signals.json
  schedule:
    # 07:00 JST Monday-Friday = 22:00 UTC Sunday-Thursday
    - cron: "0 22 * * 0-4"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-investment-forecast
  cancel-in-progress: true
jobs:
  forecast:
    runs-on: ubuntu-latest
    env:
      X_API_ENABLED: ${{ vars.X_API_ENABLED }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check scripts/daily-forecast.mjs
          node --check scripts/x-signals.mjs
          node --input-type=module -e 'import fs from "node:fs"; const html=fs.readFileSync("index.html","utf8"); const start=html.indexOf("<script>"); const end=html.indexOf("</script>",start+8); if(start<0 || end<0) throw new Error("inline script not found"); new Function(html.slice(start+8,end)); console.log("Inline app JavaScript syntax OK");'
      - name: Run daily forecast and validation
        run: node scripts/daily-forecast.mjs
      - name: Save forecast history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast-history.json market-signals.json
          if git diff --cached --quiet; then
            echo "No forecast changes to save."
          else
            git commit -m "Save daily investment forecast and validation"
            git pull --rebase origin main
            git push
          fi
