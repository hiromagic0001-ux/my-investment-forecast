name: Daily investment forecast
# The deployed app branch is the single source for the forecast engine and UI.
# Validation includes confidence bins and a neutral 50% Brier baseline.
# Manual full refresh is the primary update path; no unattended schedule is configured.
on:
  push:
    branches: [main]
    paths-ignore:
      - forecast-history.json
      - market-signals.json
      - earnings-calendar.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-investment-forecast
  cancel-in-progress: true
jobs:
  forecast:
    runs-on: ubuntu-latest
    env:
      X_API_ENABLED: ${{ vars.X_API_ENABLED }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          ref: world-market-jp225-purple-only
          fetch-depth: 0
      - name: Validate JavaScript syntax
        run: |
          node --check scripts/news-intelligence.mjs
          node --check scripts/macro-data.mjs
          node --check scripts/daily-forecast.mjs
          node --check scripts/free-x-signals.mjs
          node --check scripts/earnings-calendar.mjs
          node --check scripts/x-signals.mjs
          node --input-type=module -e 'import fs from "node:fs"; const html=fs.readFileSync("index.html","utf8"); const start=html.indexOf("<script>"); const end=html.indexOf("</script>",start+8); if(start<0 || end<0) throw new Error("inline script not found"); new Function(html.slice(start+8,end)); console.log("Inline app JavaScript syntax OK");'
      - name: Refresh market news
        run: node scripts/news-intelligence.mjs
      - name: Refresh official macro statistics
        env:
          FORCE_REFRESH: "true"
        run: node scripts/macro-data.mjs
      - name: Run daily forecast and validation
        run: node scripts/daily-forecast.mjs
      - name: Save forecast history to deployment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast-history.json market-signals.json earnings-calendar.json market-snapshot.json market-news.json macro-data.json
          if git diff --cached --quiet; then
            echo "No forecast changes to save."
          else
            git commit -m "Run complete manual investment refresh"
            git fetch origin world-market-jp225-purple-only
            git rebase FETCH_HEAD
            git push origin HEAD:world-market-jp225-purple-only
          fi
