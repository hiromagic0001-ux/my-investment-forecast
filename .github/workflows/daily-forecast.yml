name: Daily investment forecast
on:
  push:
    branches: [main]
    paths-ignore:
      - forecast-history.json
  schedule:
    # 07:00 JST Monday-Friday = 22:00 UTC Sunday-Thursday
    - cron: "0 22 * * 0-4"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-investment-forecast
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run daily forecast and validation
        run: node scripts/daily-forecast.mjs
      - name: Save forecast history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast-history.json
          if git diff --cached --quiet; then
            echo "No forecast changes to save."
          else
            git commit -m "Save daily investment forecast and validation"
            git push
          fi
