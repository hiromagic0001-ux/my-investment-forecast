name: Refresh buy-watch stock prices
on:
  schedule:
    # 09:00-16:00 JST, weekdays (00:00-07:00 UTC, Sunday-Thursday)
    - cron: "0 0-7 * * 0-4"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: buy-watch-stock-prices
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout investment app branch
        uses: actions/checkout@v4
        with:
          ref: world-market-jp225-purple-only
      - name: Fetch daily prices
        run: node scripts/fetch-buy-watch-prices.mjs
      - name: Save price data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-prices.json
          if git diff --cached --quiet; then
            echo "No price data changes."
          else
            git commit -m "Refresh buy-watch stock prices"
            git push origin HEAD:world-market-jp225-purple-only
          fi
