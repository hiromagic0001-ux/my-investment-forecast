name: Global economic news collector
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/news-intelligence.yml
      - scripts/news-intelligence.mjs
      - scripts/macro-data.mjs
      - scripts/daily-forecast.mjs
  schedule:
    # Shift away from the busiest minute boundaries while keeping a five-minute cadence.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: global-economic-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout investment app deployment branch
        uses: actions/checkout@v4
        with:
          ref: restore-world-market-japan-heatmap
          fetch-depth: 0
      - name: Restore only verified official macro cache
        run: |
          git fetch origin news-cache || true
          if git show FETCH_HEAD:macro-data.json > macro-data.json 2>/dev/null; then
            node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("macro-data.json","utf8")); if(!Number(d.fredSuccessCount||0)){fs.unlinkSync("macro-data.json"); console.log("Discarding legacy cache without verified FRED series.");} else {console.log("Restored verified FRED cache:",d.fredSuccessCount,"series.");}'
          else
            rm -f macro-data.json
            echo "No prior official macro cache; fetching all series."
          fi
      - name: Collect global economic news
        run: node scripts/news-intelligence.mjs
      - name: Collect official macroeconomic data (6-hour cache)
        run: node scripts/macro-data.mjs
      - name: Generate server-side macro and market snapshot
        run: node scripts/daily-forecast.mjs
      - name: Validate generated data
        run: |
          node --check scripts/news-intelligence.mjs
          node --check scripts/macro-data.mjs
          node --check scripts/daily-forecast.mjs
          node -e 'const d=require("./market-news.json"); if(!d.generatedAt || !Array.isArray(d.items)) throw Error("invalid news cache"); console.log("News cache valid:",d.items.length)'
          node -e 'const d=require("./macro-data.json"); if(!["ok","partial"].includes(d.status) || !Array.isArray(d.signals) || d.signals.length<3) throw Error("insufficient official macro data; refusing to publish"); console.log("Official macro series:",d.signals.length,"coverage:",d.status)'
          node -e 'const d=require("./market-snapshot.json"); if(!d.generatedAt || d.status==="collecting" || Object.keys(d.quotes||{}).length<8 || !Array.isArray(d.forecasts) || d.forecasts.length<3 || !d.macroOutlook || !Array.isArray(d.macroOutlook.components) || d.macroOutlook.components.length<10 || !d.macroData || d.macroData.signalCount<3) throw Error("incomplete market/macro snapshot; refusing to publish"); console.log("Macro snapshot valid:",Object.keys(d.quotes).length,"quotes",d.macroOutlook.components.length,"signals")'
      - name: Publish cache on isolated data branch (no app redeploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B news-cache
          for f in market-news.json market-snapshot.json macro-data.json market-signals.json earnings-calendar.json forecast-history.json; do [ ! -f "$f" ] || git add "$f"; done
          if git diff --cached --quiet; then
            echo "No news cache changes."
          else
            git commit -m "Refresh global economic news cache"
            git push --force origin news-cache
          fi
# Trigger a full server-side refresh after restoring the complete macro collector.