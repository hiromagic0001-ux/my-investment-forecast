<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>日本225 ヒートマップ</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#102039;--line:#28415f;--text:#eef5ff;--muted:#9bb0ca}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:12px}
header{max-width:1100px;margin:0 auto 12px}
.brand{font-size:10px;letter-spacing:.2em;color:#83bfff;font-weight:800}
h1{font-size:20px;margin:5px 0}
.note{font-size:11px;line-height:1.65;color:var(--muted);margin:0 0 12px}
.widget{max-width:1100px;margin:auto;height:min(76vh,780px);min-height:420px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#07111f}
tv-heatmap{display:block;width:100%;height:100%}
footer{max-width:1100px;margin:10px auto 0;font-size:10px;line-height:1.6;color:var(--muted)}
a{color:#9ccfff}
html.mini body{padding:0}
html.mini header,html.mini footer{display:none}
html.mini .widget{height:100vh;min-height:190px;border:0;border-radius:0}
</style>
<script>if(new URLSearchParams(location.search).get("mini")==="1")document.documentElement.classList.add("mini")</script>
<script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-heatmap.js"></script>
</head>
<body>
<header>
<div class="brand">WORLD MARKET BOARD</div>
<h1>日本225 ヒートマップ</h1>
<p class="note">日経225構成銘柄の騰落をTradingView公式ヒートマップで表示します。東証株式データは無料表示の場合、取引所規定により約20分遅延します。リアルタイム値ではありません。</p>
</header>
<main class="widget">
<tv-heatmap heatmap-type="stock" data-source="NIKKEI225" grouping="sector" block-size="market_cap_basic" block-color="change" locale="ja" theme="dark"></tv-heatmap>
</main>
<footer>株価・騰落率はTradingViewのデータ提供条件に従います。正確な価格の確認は各タイルを選択して銘柄詳細を開いてください。独自取得した時刻不明の株価は表示しません。<br><a href="https://www.tradingview.com/heatmap/stock/" target="_blank" rel="noopener noreferrer">TradingView公式ヒートマップ</a></footer>
</body>
</html>
